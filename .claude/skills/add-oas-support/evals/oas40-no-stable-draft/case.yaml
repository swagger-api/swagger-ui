expected_outcome: |
  The run pins the version first: no OAS 4.0 release exists, and the 4.0 working draft (the
  Moonwalk SIG repository) is a non-consensus skeleton without Fixed Fields tables that has not
  changed since March 2025, so there is nothing to build a field map or code against. It creates
