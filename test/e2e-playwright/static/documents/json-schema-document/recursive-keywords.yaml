$schema: https://json-schema.org/draft/2020-12/schema
title: Tree
# the 2019-09 predecessors of $dynamicAnchor and $dynamicRef, kept by the default
# meta-schema; the 2020-12 meta-schema takes an anchor string for $recursiveAnchor
$recursiveAnchor: node
type: object
properties:
  data: true
  children:
    type: array
    items:
      # nothing but $recursiveRef to show below the head
      $recursiveRef: "#"
  legacy:
    # 2019-09's boolean form, shown as written
    $recursiveAnchor: true
    type: object
$dynamicAnchor: node
