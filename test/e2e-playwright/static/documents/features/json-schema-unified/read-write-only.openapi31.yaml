openapi: 3.1.0
info:
  title: Unified JSON Schema readOnly and writeOnly
  version: 1.0.0
paths:
  /users:
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
          readOnly: true
        password:
          type: string
          writeOnly: true
