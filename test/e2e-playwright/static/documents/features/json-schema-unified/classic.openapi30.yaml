openapi: 3.0.3
info:
  title: Unified JSON Schema option on an OpenAPI 3.0 document
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: addPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: OK
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
