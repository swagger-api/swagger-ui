          - paragraph: The pets
          - tablist:
            - tab "Example Value" [selected]
            - tab "Model"
          - tabpanel "Example Value":
            - code: "[ { \"name\": \"string\", \"tag\": \"string\" } ]"
  - heading "Models" [level=4]:
    - button "Models" [expanded]
  - button "Pet" [expanded]:
    - strong: Pet
  - text: "{"
  - table:
    - rowgroup:
      - row "name* string":
        - cell "name*"
        - cell "string":
          - button [expanded]
          - text: ""
      - row "tag string":
        - cell "tag"
        - cell "string":
          - button [expanded]
          - text: ""
  - text: "}"