openapi: 3.2.0
info:
  title: Additional Operations
  version: 1.0.0
servers:
  - url: /api
paths:
  /items:
    get:
      tags: [Items]
      operationId: getItems
      summary: Get items with query parameters
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Items retrieved
    additionalOperations:
      LIST:
        tags: [Items]
        operationId: listItems
        summary: List items with a request body
        description: Filter items using the custom LIST method.
        parameters:
          - name: status
            in: query
            schema:
              type: string
        requestBody:
          required: true
          description: Required item filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemFilter'
              example:
                category: books
        responses:
          '200':
            description: Filtered items
            content:
              application/json:
                schema:
                  type: array
                  items:
                    type: string
          '400':
            description: Invalid item filter
      X-Search:
        tags: [Items]
        operationId: searchItems
        summary: Search with a mixed-case custom method
        servers:
          - url: /search-api
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  term:
                    type: string
              example:
                term: notebook
        responses:
          '200':
            description: Search results
components:
  schemas:
    ItemFilter:
      type: object
      required: [category]
      properties:
        category:
          type: string
